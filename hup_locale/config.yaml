name: Hup locale
version: "0.4.2"
slug: hup_locale
description: Assistente proattivo che guarda le stanze, ti propone cosa sistemare e ne parla con te a voce, in chat o via notifica.
url: https://github.com/dariomartino/hupdario
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-happy
panel_title: Hup
options:
  llm_provider: gemini
  gemini_api_key: ""
  gemini_model: gemini-flash-latest
  gemini_vision_model: gemini-flash-lite-latest
  anthropic_api_key: ""
  anthropic_model: claude-sonnet-5-5
  assistant_name: Hup
  personality: Amichevole, diretto e un po' ironico. Mai pedante, mai più di due frasi alla volta.
  person_entity: person.dario
  sleep_entity: input_boolean.hup_dormo
  privacy_entity: input_boolean.telecamere_in_privacy
  system_entity: input_boolean.pulizie_mode
  quiet_hours_start: "23:30"
  quiet_hours_end: "07:00"
  timezone: Europe/Rome
  rooms:
    - name: Cucina
      camera: camera.cucina
      motion: binary_sensor.motion_cucina_xiaomi_occupancy
      speaker: media_player.nestmini6311_2
      goal: >-
        Cucina in ordine e pulita: piani di lavoro e tavolo liberi, niente piatti o pentole
        sporche fuori dalla lavastoviglie o dal lavello, niente cibo lasciato fuori dal frigo,
        spazzatura non traboccante.
    - name: Ingresso
      camera: camera.ingresso
      motion: binary_sensor.motion_ingresso_occupancy
      goal: >-
        Ingresso libero e ordinato: scarpe nella scarpiera o allineate, giacche appese,
        niente borse, pacchi o oggetti lasciati per terra o sul mobile.
    - name: Camera da letto
      camera: camera.letto
      motion: binary_sensor.motion_letto_dx_occupancy
      satellite: assist_satellite.vaca_a6e7e87e1
      goal: >-
        Camera da letto in ordine: letto rifatto dopo che mi sono alzato, vestiti nell'armadio
        o nel cesto, comodini sgombri, niente tazze o bicchieri lasciati in giro.
    - name: Stanza degli ospiti
      camera: camera.ospiti
      speaker: notify.alexa_media_echo_show_ospiti
      goal: >-
        Stanza degli ospiti ordinata e pronta: niente oggetti accumulati su letto, sedie o
        pavimento, non deve diventare un ripostiglio.
    - name: Studio
      camera: camera.studio
      speaker: notify.alexa_media_echo_studio
      goal: >-
        Studio ordinato: scrivania sgombra a fine giornata, cavi e attrezzi riposti, niente
        tazze o piatti dimenticati, carte in pila o archiviate.
  satellites:
    - entity: assist_satellite.vaca_a6e7e87e1
      motion:
        - binary_sensor.motion_letto_dx_occupancy
        - binary_sensor.motion_letto_sx_occupancy
    - entity: assist_satellite.home_assistant_voice_09a614_assist_satellite
      motion:
        - binary_sensor.motion_sala_xiaomi_occupancy
  feedback_script: script.hup_risposta
  notify_service: notify.mobile_app_xiaomi_15t_pro
  tts_entity: tts.google_ai_tts
  speaker_select: input_select.hup_altoparlante_avvisi
  speakers:
    - name: View Assist camera da letto
      entity: assist_satellite.vaca_a6e7e87e1
    - name: Nest cucina
      entity: media_player.nestmini6311_2
    - name: Echo studio
      entity: notify.alexa_media_echo_studio
    - name: Echo Show ospiti
      entity: notify.alexa_media_echo_show_ospiti
    - name: Echo salotto
      entity: notify.alexa_media_echo_salotto
    - name: HA Voice soggiorno
      entity: assist_satellite.home_assistant_voice_09a614_assist_satellite
  telegram_bot_token: ""
  telegram_chat_id: ""
  check_interval_minutes: 30
  min_minutes_between_checks: 10
  motion_cleared_minutes: 3
  reminder_minutes: 30
  postpone_minutes: 20
  postpone_entity: input_number.hup_rimanda_minuti
  max_reminders: 3
  max_open_tasks: 4
  max_tasks_entity: input_number.hup_compiti_massimi
  voice_presence_minutes: 10
  voice_reply_timeout_minutes: 3
schema:
  llm_provider: list(gemini|anthropic)
  gemini_api_key: password?
  gemini_model: str
  gemini_vision_model: str?
  anthropic_api_key: password?
  anthropic_model: str
  assistant_name: str
  personality: str
  person_entity: str
  sleep_entity: str?
  privacy_entity: str?
  system_entity: str?
  quiet_hours_start: str
  quiet_hours_end: str
  timezone: str
  rooms:
    - name: str
      camera: str
      motion: str?
      satellite: str?
      speaker: str?
      goal: str
  satellites:
    - entity: str
      motion:
        - str
  feedback_script: str
  notify_service: str?
  tts_entity: str
  speaker_select: str?
  speakers:
    - name: str
      entity: str
  telegram_bot_token: password?
  telegram_chat_id: str?
  check_interval_minutes: int(5,600)
  min_minutes_between_checks: int(1,120)
  motion_cleared_minutes: int(0,60)
  reminder_minutes: int(5,600)
  postpone_minutes: int(5,600)
  postpone_entity: str?
  max_reminders: int(0,10)
  max_open_tasks: int(1,10)
  max_tasks_entity: str?
  voice_presence_minutes: int(1,120)
  voice_reply_timeout_minutes: int(1,30)
